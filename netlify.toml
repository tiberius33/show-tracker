[build]
  # Pre-deploy checks run before the Next.js build.
  # If any API health check fails, the build exits non-zero and the deploy is blocked.
  command = "rm -rf .next out && npm run test:pre-deploy && npm run build"
  publish = "out"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"
  # Skip @netlify/plugin-nextjs — this project uses output: 'export' (static)
  # and the plugin's own build cache was preventing our source changes from
  # being compiled into new JavaScript bundles.
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

# Daily anniversary reminder job ("X years ago today you saw...") — runs
# once a day at 13:00 UTC. See netlify/functions/anniversary-notifications.js.
[functions."anniversary-notifications"]
  schedule = "0 13 * * *"

# Daily venue-bucket-list match job ("your favorite artist is playing at a
# venue on your bucket list") — runs once a day at 13:30 UTC, offset from
# the anniversary job above. See
# netlify/functions/venue-bucket-list-notifications.js.
[functions."venue-bucket-list-notifications"]
  schedule = "30 13 * * *"

# Rewrite /api/* to Netlify functions for static export compatibility
[[redirects]]
  from = "/api/send-email"
  to = "/.netlify/functions/send-email"
  status = 200

[[redirects]]
  from = "/api/send-email/"
  to = "/.netlify/functions/send-email"
  status = 200

[[redirects]]
  from = "/api/delete-account"
  to = "/.netlify/functions/delete-account"
  status = 200

[[redirects]]
  from = "/api/delete-account/"
  to = "/.netlify/functions/delete-account"
  status = 200

[[redirects]]
  from = "/api/email-preferences"
  to = "/.netlify/functions/update-email-preferences"
  status = 200

[[redirects]]
  from = "/api/email-preferences/"
  to = "/.netlify/functions/update-email-preferences"
  status = 200

[[redirects]]
  from = "/api/unsubscribe"
  to = "/.netlify/functions/unsubscribe"
  status = 200

[[redirects]]
  from = "/api/unsubscribe/"
  to = "/.netlify/functions/unsubscribe"
  status = 200

# Public, indexable pages — server-rendered HTML from Netlify Functions, not
# the SPA shell, so crawlers see real content without executing JavaScript.
# Order matters: the more specific /u/:handle/shows/:showId rules are listed
# before the plain /u/:handle rules purely for readability — Netlify's
# :param placeholders only match a single path segment, so a request with
# an extra /shows/:showId segment could never match the shorter pattern
# regardless of order. All of these must stay above the final catch-all.
[[redirects]]
  from = "/u/:handle/shows/:showId"
  to = "/.netlify/functions/public-show?handle=:handle&showId=:showId"
  status = 200

[[redirects]]
  from = "/u/:handle/shows/:showId/"
  to = "/.netlify/functions/public-show?handle=:handle&showId=:showId"
  status = 200

[[redirects]]
  from = "/u/:handle"
  to = "/.netlify/functions/public-profile?handle=:handle"
  status = 200

[[redirects]]
  from = "/u/:handle/"
  to = "/.netlify/functions/public-profile?handle=:handle"
  status = 200

[[redirects]]
  from = "/shared/:id"
  to = "/.netlify/functions/public-shared?id=:id"
  status = 200

[[redirects]]
  from = "/shared/:id/"
  to = "/.netlify/functions/public-shared?id=:id"
  status = 200

# Replaces the old static public/sitemap.xml (6 fixed URLs) with a
# generated one that also lists every opted-in public profile.
[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/sitemap"
  status = 200
  force = true

# Catch-all SPA fallback — lets Next.js handle dynamic routes like /shows/[id]/
# that are not pre-generated at build time (Firebase data is runtime-only).
# Must be last so API rules above take priority.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
