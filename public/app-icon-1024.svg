<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Solid background (App Store requires no transparency) -->
  <rect width="1024" height="1024" fill="#1f1f3a"/>

  <defs>
    <linearGradient id="pickMain" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" style="stop-color:#10d98a"/>
      <stop offset="40%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
    <linearGradient id="pickLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#047857"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
    <linearGradient id="pickHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6ee7b7;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:0"/>
    </linearGradient>
    <filter id="pickShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="10" stdDeviation="24" flood-color="#059669" flood-opacity="0.55"/>
    </filter>
    <clipPath id="pickClip">
      <path d="M512 247c-93 0-180 54-180 153 0 132 144 300 180 327 36-27 180-195 180-327 0-99-87-153-180-153Z"/>
    </clipPath>
  </defs>

  <!-- Guitar pick / setlist mark, same silhouette as components/brand/Pick.jsx,
       scaled up 33% and re-centered on the canvas so the glyph reads larger
       at home-screen size while staying inside the maskable-icon safe margin. -->
  <g transform="translate(512 512) scale(1.3333) translate(-512 -512)">
    <g filter="url(#pickShadow)">
      <path d="M512 247c-93 0-180 54-180 153 0 132 144 300 180 327 36-27 180-195 180-327 0-99-87-153-180-153Z"
            fill="url(#pickMain)"/>
      <path d="M512 247c-56 0-108 21-142 60-22 25-38 55-38 93 0 86 65 190 150 275-46-78-84-165-84-240 0-84 47-150 114-188Z"
            fill="url(#pickLeft)" opacity="0.55"/>
      <path d="M512 247c68 0 128 32 158 87-24-40-78-80-158-87Z"
            fill="url(#pickHighlight)" opacity="0.7"/>
    </g>

    <!-- Setlist lines — a converging fan, each shorter than the last, to stay
         inside the pin's taper without needing exact bezier math. -->
    <g clip-path="url(#pickClip)">
      <path d="M372 424 Q 512 450 652 412" fill="none" stroke="rgba(255,255,255,0.8)" stroke-width="9" stroke-linecap="round"/>
      <circle cx="372" cy="424" r="13" fill="rgba(255,255,255,0.9)"/>
      <path d="M388 478 Q 512 508 636 466" fill="none" stroke="rgba(255,255,255,0.65)" stroke-width="9" stroke-linecap="round"/>
      <circle cx="388" cy="478" r="13" fill="rgba(255,255,255,0.8)"/>
      <path d="M410 532 Q 512 564 614 518" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="9" stroke-linecap="round"/>
      <circle cx="410" cy="532" r="13" fill="rgba(255,255,255,0.7)"/>
      <path d="M440 584 Q 512 612 584 568" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="9" stroke-linecap="round"/>
      <circle cx="440" cy="584" r="13" fill="rgba(255,255,255,0.6)"/>
    </g>
  </g>
</svg>
